# XcodeGen spec — run `xcodegen generate`, then open HoldfastBrick.xcodeproj
name: HoldfastBrick
options:
  bundleIdPrefix: solutions.branson
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    DEVELOPMENT_TEAM: 2MF4Q85LAQ
    CODE_SIGN_STYLE: Automatic

packages:
  # SUPPLY CHAIN: Citadel's SSH protocol layer is a community fork of
  # apple/swift-nio-ssh (Apple hasn't merged their PRs for years; 0.12.x
  # pins Wellz26/swift-nio-ssh). Package.resolved freezes exact commits,
  # so review the transitive pins whenever bumping this version.
  Citadel:
    url: https://github.com/orlandos-nl/Citadel
    from: 0.12.1

targets:
  HoldfastBrick:
    type: application
    platform: iOS
    sources: [HoldfastBrick]
    dependencies:
      - package: Citadel
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: solutions.branson.HoldfastBrick
        MARKETING_VERSION: 0.1.0
        CURRENT_PROJECT_VERSION: 1
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_CFBundleDisplayName: Holdfast
    info:
      path: HoldfastBrick/Info.plist
      properties:
        CFBundleDisplayName: Holdfast
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: ["UIInterfaceOrientationPortrait", "UIInterfaceOrientationPortraitUpsideDown", "UIInterfaceOrientationLandscapeLeft", "UIInterfaceOrientationLandscapeRight"]
        # Bonjour discovery of the Pi on the home network.
        NSLocalNetworkUsageDescription: "Holdfast finds your privacy device on your home WiFi so the app can talk to it directly. Nothing leaves your network."
        NSBonjourServices: ["_holdfastbrick._tcp"]
        # The brick API is HTTPS with a certificate from the household CA the
        # phone already trusts. NSAllowsLocalNetworking covers Bonjour and LAN
        # addresses; the plain-http dev-brick fallback in EndpointResolver is
        # therefore limited to local addresses (intentional).
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true

  HoldfastBrickTests:
    type: bundle.unit-test
    platform: iOS
    sources: [HoldfastBrickTests]
    dependencies:
      - target: HoldfastBrick

  HoldfastBrickUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [HoldfastBrickUITests]
    dependencies:
      - target: HoldfastBrick

schemes:
  HoldfastBrick:
    build:
      targets:
        HoldfastBrick: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - HoldfastBrickTests
        - HoldfastBrickUITests
